{% extends "base.html" %}
{% block title %}Entrar - RPGBox{% endblock %}
{% block content %}
<h1>Entrar</h1>
<p class="muted">Sua campanha em um só lugar, pronta para a próxima sessão.</p>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit" class="btn">Entrar</button>
</form>
<p><a href="{% url 'signup' %}">Criar conta</a></p>
{% endblock %}
