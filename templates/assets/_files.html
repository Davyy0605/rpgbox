{% if files %}
<ul class="list">
  {% for a in files %}
  <li class="file-row"><a href="{% url 'asset-open' a.id %}">{{ a.filename }}</a>
    <form method="post" action="{% url 'asset-delete' a.id %}">{% csrf_token %}<button class="btn-link" type="submit">Excluir</button></form></li>
  {% endfor %}
</ul>
{% endif %}
