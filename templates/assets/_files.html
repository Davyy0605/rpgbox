{% if files %}
<ul class="list">
  {% for a in files %}
  <li class="file-row"><a href="{% url 'asset-open' a.id %}">{{ a.filename }}</a>
    <form method="post" action="{% url 'asset-delete' a.id %}">{% csrf_token %}<button class="btn-link" type="submit">Excluir</button></form></li>
  {% endfor %}
</ul>
{% endif %}
<form method="post" action="{% url 'asset-upload' record.id %}" enctype="multipart/form-data" class="form">
  {% csrf_token %}
  <input type="hidden" name="tab" value="{{ selected.id }}">
  <input type="file" name="file" aria-label="Anexar arquivo" required>
  <button class="btn" type="submit">Anexar</button>
</form>
