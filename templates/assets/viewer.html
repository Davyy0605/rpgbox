{% extends "base.html" %}
{% block title %}{{ asset.filename }}{% endblock %}
{% block crumbs %}<a href="{% url 'record-detail' record.id %}">{{ record.name }}</a>{% endblock %}
{% block content %}
<h1>{{ asset.filename }}</h1>
{% if asset.kind == "image" %}
<img class="viewer-img" src="{{ file_url }}" alt="{{ asset.filename }}" width="{{ asset.width }}" height="{{ asset.height }}">
{% else %}
<div class="pdf-viewer" data-pdf-url="{{ file_url }}"><a class="btn-link" href="{{ file_url }}">Abrir PDF</a></div>
{% endif %}
<p><a class="btn-link" href="{% url 'asset-file' asset.id %}">Baixar</a></p>
{% endblock %}
