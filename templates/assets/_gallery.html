<div id="arquivos" hx-target="this" hx-swap="innerHTML show:none">{% include "assets/_items.html" %}</div>
<form method="post" action="{% url 'asset-upload' record.id %}" enctype="multipart/form-data" class="form dropzone">
  {% csrf_token %}
  {% if upload_tab %}<input type="hidden" name="tab" value="{{ upload_tab }}">{% endif %}
  <div data-dropzone><input type="file" name="file" aria-label="Adicionar arquivo, ou arraste e cole aqui" required></div>
  <button class="btn" type="submit">Enviar</button>
</form>
