{% extends "base.html" %}
{% block title %}{{ campaign.name }} · RPGBox{% endblock %}
{% block crumbs %}<a href="{% url 'campaign-list' %}">Campanhas</a>{% endblock %}
{% block content %}
<div class="head-row">
  <h1>{{ campaign.name }}</h1>
  <a class="plus" href="{% url 'type-new' campaign.id %}" aria-label="Novo tipo">+</a>
</div>
<p><a href="{% url 'campaign-export' campaign.id %}">Exportar campanha</a></p>
<form class="form" role="search" action="{% url 'search' campaign.id %}">
  <input type="search" name="q" placeholder="Buscar" aria-label="Buscar" autocomplete="off" hx-get="{% url 'search' campaign.id %}" hx-trigger="input changed delay:200ms, search" hx-target="#results" hx-swap="outerHTML">
</form>
<ul class="list" id="results"></ul>
<ul class="list">
  {% for t in types %}
  <li class="type-row"><a class="type-link" href="{% url 'record-list' campaign.id t.id %}">{{ t.name }} <span class="muted">{{ t.total }}</span></a><a class="plus" href="{% url 'record-new' campaign.id t.id %}" aria-label="Novo em {{ t.name }}">+</a></li>
  {% endfor %}
</ul>
{% endblock %}
